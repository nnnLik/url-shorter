[project]
name = "url-shorter"
version = "0.1.0"
requires-python = "==3.13.*"

[dependency-groups]
dev = [
    "ipython==9.8.0",
    "ruff==0.14.9",
]
prod = [
    "fastapi==0.124.4",
    "uvicorn==0.38.0",
    "loguru>=0.7.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "taskiq==0.12.1",
    "taskiq-aio-pika==0.5.0",
    "taskiq-fastapi==0.4.0",
    "redis==7.1.0",
    "asyncpg==0.31.0",
    "alembic==1.17.2",
    "orjson==3.11.5",
]

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4
exclude = [
    "**/migrations/**",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "T20",  # flake8-print
    "T10",  # flake8-debugger
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff-specific rules
    "DTZ",  # flake8-datetimez
    "ERA",  # eradicate
    "FURB", # refurb
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S110",  # try-except-pass (sometimes needed)
    "S104",  # binding to all interfaces (0.0.0.0) - OK for Docker containers
]
fixable = ["I", "E", "F", "W", "UP"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
