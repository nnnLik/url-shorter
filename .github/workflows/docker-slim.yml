name: Docker Slim Build

on:
  push:
    branches: [master, main]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/docker-slim.yml'
  workflow_dispatch:

jobs:
  slim-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        run: |
          docker build -t url-shorter:dev --target dev .

      - name: Run DockerSlim
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            dslim/slim build \
            --target url-shorter:dev \
            --expose 6749 \
            --http-probe=false \
            --continue-after=30 \
            --include-path '/opt/pysetup' \
            --include-path '/opt/app' \
            --include-exe 'python' \
            --include-exe 'uv' \
            --include-exe 'curl' \
            --include-exe 'vim' \
            --include-exe 'htop' \
            url-shorter:dev

      - name: Show image sizes
        run: |
          echo "## 📊 Image Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          docker images --format "| {{.Repository}}:{{.Tag}} | {{.Size}} |" | grep url-shorter >> $GITHUB_STEP_SUMMARY || true
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep -E "url-shorter|REPOSITORY"

      - name: Save slim image
        if: github.event_name == 'push'
        run: |
          docker tag url-shorter.slim:latest url-shorter.slim:dev
          docker tag url-shorter.slim:latest url-shorter:dev
          echo "✅ Slim image tagged successfully"

